    <!-- The studio mark, not the game icon: this is geofastgames.com.
         Order matters, browsers take the first format they support. Every
         file here is the same hatched circle: RGB is flat #4CFC97 and only
         the alpha channel carries the shape, so nothing but green can ever
         render and no white or black fringe appears on any background.
         The .ico carries true 32-bit RGBA entries (16-64px) — if a black
         square ever comes back, suspect how the alpha was encoded there,
         not transparency itself. apple-touch-icon is the one exception:
         iOS flattens alpha onto black, so it is filled with the same green. -->
